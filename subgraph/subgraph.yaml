specVersion: 0.0.5
description: Solana subgraph example
repository: https://github.com/BoringSoul/solana-contracts
schema:
  file: ./schema.graphql
dataSources:
  - kind: solana
    name: solana-contract
    network: devnet
    source:
      address: "E6qJKiFiq2f23Qf9Zx4cuqJTeJasi5XVrV1wvge6BZjc"
      startBlock: 0
    mapping:
      kind: solana/mappings
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - WrapEvent
        - MintEvent
        - BurnEvent
        - StakeEvent
        - UnstakeEvent
      eventHandlers:
        - event: WrapEvent
          handler: handleWrapEvent
        - event: MintEvent
          handler: handleMintEvent
        - event: BurnEvent
          handler: handleBurnEvent
        - event: StakeEvent
          handler: handleStakeEvent
        - event: UnstakeEvent
          handler: handleUnstakeEvent
      file: ./src/mapping.ts